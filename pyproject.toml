[project]
name = "gauntlet-repo2env"
version = "0.1.0"
description = "Turn any Python GitHub repo into a Docker test environment, and mine SWE-style coding tasks from its git history."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abhishek", email = "akvikramaditya007cppcoder@gmail.com" }]
keywords = ["agents", "swe-bench", "benchmark", "docker", "reinforcement-learning", "llm", "evaluation"]
dependencies = ["gauntlet-sandbox @ git+https://github.com/abhishekcpp007/gauntlet-sandbox", "pydantic>=2.6"]

[project.scripts]
repo2env = "gauntlet_repo2env.cli:main"

[project.urls]
Homepage = "https://github.com/abhishekcpp007/gauntlet-repo2env"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_repo2env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and network access"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
